<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini RAG Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c1f24; --muted:#6b7280; --accent:#2f5bea; --user:#e8eefc; --err:#b42318; --line:#e3e6ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --ink:#e8eaed; --muted:#9aa1ab; --accent:#7c9cff; --user:#26314f; --err:#ff8a80; --line:#2c3038; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; flex-direction:column; height:100dvh; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { margin:0; font-size:1.05rem; }
  header p { margin:2px 0 0; color:var(--muted); font-size:.85rem; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; max-width:85%; white-space:pre-wrap; overflow-wrap:anywhere; border:1px solid var(--line); background:var(--card); }
  .msg.user { align-self:flex-end; background:var(--user); border-color:transparent; }
  .msg.bot { align-self:flex-start; }
  .msg.err { color:var(--err); }
  .msg.pending { color:var(--muted); font-style:italic; }
  form { display:flex; gap:10px; padding:14px 20px; border-top:1px solid var(--line); background:var(--card); max-width:none; }
  .row { display:flex; gap:10px; width:100%; max-width:820px; margin:0 auto; }
  input { flex:1; padding:11px 14px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { padding:11px 20px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.55; cursor:progress; }
</style>
</head>
<body>
<header>
  <h1>Gemini RAG Agent</h1>
  <p>Ask a question about the indexed documents.</p>
</header>
<main id="log" aria-live="polite"></main>
<form id="form">
  <div class="row">
    <input id="q" type="text" placeholder="Ask about the documents…" autocomplete="off" maxlength="1000" required>
    <button id="send" type="submit">Send</button>
  </div>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const send = document.getElementById("send");

  function add(text, cls) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;           // textContent: model output is never parsed as HTML
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  add("Hi! Ask me anything about the documents I have been given.", "bot");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add(message, "user");
    input.value = "";
    send.disabled = true;
    const pending = add("Thinking…", "bot pending");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ message }),
      });
      const data = await res.json();
      pending.textContent = data.answer || "No answer returned.";
      pending.className = "msg bot" + (data.error || !res.ok ? " err" : "");
    } catch (err) {
      pending.textContent = "Could not reach the server. Please try again.";
      pending.className = "msg bot err";
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
